[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tafsiri-mcp"
version = "0.1.9"
description = "Kenya translation and language resources: Swahili/English civic glossary, Kikuyu and Luo guides, official document terminology, language detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0.0"]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
tafsiri-mcp = "tafsiri_mcp.server:mcp.run"

[project.urls]
Homepage = "https://github.com/gabrielmahia/tafsiri-mcp"
Documentation = "https://github.com/gabrielmahia/nairobi-stack"
"MCP Registry" = "https://registry.modelcontextprotocol.io"
Datasets = "https://huggingface.co/gmahia"
Evaluation = "https://github.com/gabrielmahia/kipimo"
[tool.setuptools.packages.find]
where = ["src"]
